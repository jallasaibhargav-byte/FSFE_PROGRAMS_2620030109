<html>
    <head>
        <title>
            Accessibilty Styling demo
        </title>
        <style>
            body {
                font-family: Arial;
            }
            button {
                padding: 10px 20px;
                background: darkblue;
                color: white;
                border: none;
            }
            button:focusb{
                outline: 10px solid yellow;
                outline-offset: 4px;
            }
            .box {
                margin-top: 20px;
                padding: 15px;
                background: #222;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <button>Press Tab to Focus Me</button>
        <div class="box">High Contrast Text for better readability</div>
    </body>
</html>
