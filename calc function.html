<!--Write a css program to demonstrate CALC Function-->
<html>
    <head>
        <title>CSS Calc() Demo</title>
        <style>
            .container{
                width: 100%;
                border: 2px solid black;
                padding: 20px;
            }
            .box{
                height: 100px;
                background-color: lightblue;
                width: calc(100% - 900px);
            }
        </style>
    </head>
    <body>
        <h3>CSS Calc() Demo</h3>
        <div class="container">
            <div class="box"></div>
        </div>
    </body>
</html>
