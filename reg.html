<html>
    <head>
        <title>
            REGISTRATION PAGE
        </title>
    </head>
    <body align="center">
        <h1> REGISTRATION PAGE </h1>
        <form action="success.html" method="post">
            Name: <input type="text" placeholder="Enter your name" name="g1" autofocus>
            <br><br>


            Email: <input type="email" placeholder="abc@klh.edu.in" name="g2" required>
            <br><br>


            Mobile: <input type="tel" name="g3" placeholder="Mobile No." pattern="[0-9]{10}" required>
            <br><br>


            Course: <select name="g4" required>
                <option value="1">SELECT</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
                <option>P.hD</option>
            </select>
            <br><br>


            Gender: <input type="radio" name="g5" required>Male
            <input type="radio" name="g5" required>Female
            <br><br>


            Address: <textarea name="g6" required rows="3" cols="30" placeholder="Enter Address"></textarea>
            <br><br>

            Skills Known: <input type="checkbox" name="g7">CSS
                        <input type="checkbox" name="g7">Java Script
                        <input type="checkbox" name="g7">HTML
                        <input type="checkbox" name="g7">PHP
                        <br><br>
            
            Inter Percentage: <input type="number" name="g8" min="0" max="100" required>
            <br><br>

            Upload Photo: <input type="file" name="g9" accept=".jpg,.jpeg,.png">
            <br><br>

            Password: <input type="password" name="g10" minlength="8" required>
            <br><br>

            <input type="checkbox" name="g11" required>I agree to the terms and conditions
            <br><br>

            <button type="submit"> Register</button>
            <button type="reset"> Clear all</button>

        </form>
    </body>
</html>
