<html>
    <head>
        <title>
            Registration Page
        </title>
    </head>
    <body align="center">
        <h1>Employee Registration Page</h1>
        <form>
            Employee Name: <input type="text" placeholder="Enter your name" name="g1" autofocus>
            <br><br>

            Password: <input type="password" name="g2" min="8" required>
            <br><br>

            Email: <input type="email" name="g3">
            <br><br>

            Mobile Number: <input type="tel" name="g4" pattern="[0-9]{10}" required>
            <br><br>

            Age: <input type="number" name="g5" required>
            <br><br>

            Date of Birth: <input type="date" name="g6">
            <br><br>

            Preferred Interview Time: <input type="time" name="g7">
            <br><br>

            Gender: <input type="radio" name="g7">Male
            <input type="radio" name="g7">Female
            <br><br>

            Skills: <input type="checkbox" name="g8">CSS
                        <input type="checkbox" name="g8">Java Script
                        <input type="checkbox" name="g8">HTML
                        <br><br>
            
            Department: <select name="g9">
                <option value="1">SELECT</option>
                <option>CSE</option>
                <option>AIDS</option>
                <option>CSIT</option>
                <option>ECE</option>
            </select>
            <br><br>

            Upload Resume: <input type="file" name="g10">
            <br><br>

            Address: <textarea name="g11" required rows="3" cols="30" placeholder="Enter Address"></textarea>
            <br><br>

            Work Experience: <input type="range" name="g12">
            <br><br>

            LinkedIn Profile: <input type="url" name="g13" placeholder="Enter LinkedIn URL">
            <br><br>

            <button type="submit">Register</button>
            <button type="reset">Reset</button>

        </form>
    </body>
</html>
