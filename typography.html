<html>
    <head>
        <title>
            Typography 
        </title>
        <style>
            body{
                font-family: Georgia, 'Times New Roman', Times, serif;
                line-height: 1.5;
            }
            .tight{
                line-height: 15;
            }
            .loose{
                line-height: 1.8;
            }
            .light{
                font-weight: 300;
            }
            .bold{
                font-weight: 900;
            }

        </style>
    </head>
    <body>
        <p class="tight">
            Tight line-height makes text harder to read when content is long.
        </p>
        <p class="loose">
            Loose line-height improves readability, especially for paragraphs.
        </p>
        <p class="light">
            Light font weight is subtle and modern.
        </p>
        <p class="bold">
            Bold font is good for emphasis and headings.
        </p>
    </body>
</html>
